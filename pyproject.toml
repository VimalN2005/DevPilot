[project]
name = "devpilot"
version = "0.1.0"
description = "DevPilot - Production-grade AI Engineering Platform for Codebase Intelligence & Developer Automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "numpy>=1.26.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
